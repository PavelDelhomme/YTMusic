# =============================================================================
# YTMusic — Production (Portainer / VPS)
# Conteneur unique : API + frontend web (PWA) + WebSocket
# =============================================================================

services:
  ytmusic:
    image: ${YTMUSIC_IMAGE:-ghcr.io/paveldelhomme/ytmusic:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ytmusic
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8787"
      JWT_SECRET: ${JWT_SECRET:?Définis JWT_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-ytmusic.delhomme.ovh}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-https://ytmusic.delhomme.ovh}
    volumes:
      - ytmusic_data:/app/data
    networks:
      - npm-network
      - shared
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - ytmusic.role=app

volumes:
  ytmusic_data:

networks:
  # Réseau Nginx Proxy Manager (hostname résolu : ytmusic)
  npm-network:
    external: true
    name: nginx-proxy-manager_npm-network
  # Réseau partagé optionnel (comme nextcloud / n8n)
  shared:
    external: true
    name: shared-network-copy
